global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: demo-services
    static_configs:
      - targets: ["demo-gateway:8100", "demo-checkout:8101", "demo-payment:8102"]
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:9464"]

